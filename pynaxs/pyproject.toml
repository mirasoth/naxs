[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynaxs"
version = "0.1.0"
description = "Python validator for the Neural Architecture Exchange Specification (NAXS)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "jsonschema>=4.18",
]

[project.scripts]
pynaxs = "pynaxs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
