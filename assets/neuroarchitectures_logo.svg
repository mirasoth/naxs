<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-label="NeuroArchitectures logo">
  <defs>
    <linearGradient id="synapse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Mark: hexagonal "architecture" frame -->
  <g transform="translate(96,100)" filter="url(#glow)">
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"
             fill="none" stroke="url(#stroke)" stroke-width="4"
             stroke-linejoin="round"/>

    <!-- Synapses -->
    <g stroke="url(#synapse)" stroke-width="1.6" opacity="0.75">
      <line x1="0"    y1="-30" x2="-27"  y2="-6"/>
      <line x1="0"    y1="-30" x2="27"   y2="-6"/>
      <line x1="0"    y1="-30" x2="0"    y2="0"/>
      <line x1="-27"  y1="-6"  x2="0"    y2="0"/>
      <line x1="27"   y1="-6"  x2="0"    y2="0"/>
      <line x1="-27"  y1="-6"  x2="-24"  y2="30"/>
      <line x1="27"   y1="-6"  x2="24"   y2="30"/>
      <line x1="0"    y1="0"   x2="-24"  y2="30"/>
      <line x1="0"    y1="0"   x2="24"   y2="30"/>
      <line x1="-24"  y1="30"  x2="24"   y2="30"/>
    </g>

    <!-- Neurons -->
    <g fill="url(#synapse)">
      <circle cx="0"   cy="-30" r="7"/>
      <circle cx="-27" cy="-6"  r="5"/>
      <circle cx="27"  cy="-6"  r="5"/>
      <circle cx="0"   cy="0"   r="8"/>
      <circle cx="-24" cy="30"  r="5"/>
      <circle cx="24"  cy="30"  r="5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="176" y="112" font-size="42" font-weight="700" letter-spacing="0.5">
      <tspan fill="#0f172a">Neuro</tspan><tspan fill="url(#stroke)">Architectures</tspan>
    </text>
    <text x="178" y="140" font-size="13" font-weight="500" letter-spacing="6" fill="#64748b">
      STRUCTURED MINDS
    </text>
  </g>
</svg>
